name: Build Windows .exe

# Builds ASYCUDA_SAD_Generator.exe on a clean Windows runner.
# - Run it by hand from the Actions tab ("Run workflow") → download from the run's Artifacts.
# - Push a tag like v3.0.0 → the .exe is also attached to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: pytest -q
      - name: Build
        run: pyinstaller --clean --noconfirm ASYCUDA_SAD_Generator.spec
      - name: Smoke test
        shell: pwsh
        run: |
          .\dist\ASYCUDA_SAD_Generator.exe --version
          .\dist\ASYCUDA_SAD_Generator.exe template --simple -o dist\SAD_Input_Template.xls
          .\dist\ASYCUDA_SAD_Generator.exe template -o dist\SAD_MODEL.xls
          .\dist\ASYCUDA_SAD_Generator.exe generate dist\SAD_Input_Template.xls --no-lookup -o dist\smoke.xls
          if (!(Test-Path dist\smoke.xls)) { throw "smoke test failed" }
          if (!(Test-Path dist\smoke_duty.xls)) { throw "duty sheet missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: ASYCUDA_SAD_Generator-windows
          path: |
            dist/ASYCUDA_SAD_Generator.exe
            dist/SAD_MODEL.xls
            dist/SAD_Input_Template.xls
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ASYCUDA_SAD_Generator.exe
            dist/SAD_MODEL.xls
            dist/SAD_Input_Template.xls
